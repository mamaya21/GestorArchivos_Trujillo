name: Quality gates
on:
  push:
    branches: [main, fix/sync-permission-boundaries-20261015]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore solution
        run: dotnet restore GestorArchivos.sln
      - name: Build solution
        run: dotnet build GestorArchivos.sln --configuration Release --no-restore
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
  # SQL Server integration tests are deliberately not run on GitHub-hosted runners:
  # their factory currently requires a local .\\SQLEXPRESS instance.
  # Use scripts/Test-GestorArchivos.ps1 -IntegrationTests on an isolated Windows test host.
